name: CI Gate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake pkg-config libgtk-3-dev
      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
      - name: Run full test, coverage, and AGENTS.md gate
        run: ./scripts/run-tests.sh

